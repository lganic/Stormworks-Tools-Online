<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Stormworks Lua Image Editor</title>
    <meta name="description" content="All in one editor for Stormworks Lua Images">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/pixel-editor.css">
    <link rel="stylesheet" href="/css/loading-modal.css">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="/js/pixel-editor.js"></script>
    <script defer src="/js/quantization.js"></script>
    <script defer src="/js/loading-modal.js" defer></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/optimize.js"></script>
</head>

<body>
    <header>
        <a href="/" style="margin:0; display: flex;">
            <img src="/favicon.svg" height="32px">
            <h1>Stormworks Tools</h1>
        </a>
        <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="lganic" data-description="Support me on Buy me a coffee!" data-message="" data-color="#BD5FFF" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
    </header>
    <main>
        <aside>
            <div class="eyebrow">IMPORT</div>
         
            <section><label for="imageInput">Input File</label>
                <input type="file" id="imageInput" accept="image/*" name="Image File" size="18">

                <dialog id="resizeModal" style="width: 850px;">
                    <h2>Import Image</h2>

                    <div>
                        <img id="preview" style="width: 400px; height: 200px; display:inline-block">
                        <canvas id="resample-preview" style="width: 400px; height: 200px; display:inline-block"></canvas>
                    </div>

                    <div class="eyebrow">SIZE</div>
                    <section class="export-tools" id="tools">

                    <div class="number-row" style="display: block; margin: 0;">
                        <p style="margin: 0;">Width</p>
                        <input id="monitor-width-2" type="number" min="1" max="9" step="1" value="3">
                    </div>
                    <div class="number-row" style="display: block; margin: 0">
                        <p style="margin: 0;">Height</p>
                        <input id="monitor-height-2" type="number" min="1" max="5" step="1" value="3">
                    </div>

                    </section>


                    <div>
                        <h4 style="display:inline-block">Resampling:</h4>
                        <select id="resampling" style="display: inline-block;">
                            <option value="nearest">Nearest Neighbor</option>
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <label for="example">Quantization</label>
                        
                    <div class="number-row">
                        <input id="quantization_enabled" type="checkbox" style="height:30px" checked>
                        <div id="hide_on_no_quantization" class="number-row">
                            <input id="quantization" type="number" min="1" max="100" step="1" value="10">
                            <input id="quantization-range" aria-label="Example slider" type="range" min="1" max="100" step="1" value="10">
                        </div>
                    </div>

                    <br>

                    <div>
                        <button id="cancel">Cancel</button>
                        <button id="import">Import</button>
                    </div>
                </dialog>
            </section>

            <div class="eyebrow">EXPORT</div>

            <section class="export-tools" id="tools">
            <button id="export_lua">Export</button>
            <label><input id="optimize" type="checkbox" checked> Optimize</label>
            </section>


            <div class="eyebrow">SIZE</div>
            <section class="export-tools" id="tools">

            <div class="number-row" style="display: block; margin: 0;">
                <p style="margin: 0;">Width</p>
                <input id="monitor-width" type="number" min="1" max="9" step="1" value="3">
            </div>
            <div class="number-row" style="display: block; margin: 0">
                <p style="margin: 0;">Height</p>
                <input id="monitor-height" type="number" min="1" max="5" step="1" value="3">
            </div>

            </section>

            <div class="eyebrow">TOOLS</div>
            <section class="tools" id="tools">
                <button type="button" data-tool="pencil">Pencil</button>
                <button type="button" data-tool="line">Line</button>
                <button type="button" data-tool="fill">Fill</button>
                <button type="button" data-tool="pan">Pan</button>
            </section>

            <div class="eyebrow">COLOR</div>
            <section>
                <div class="palette" id="palette"></div>
                <div class="custom-color-row">
                    <input id="custom-color" type="color" value="#7050b5" aria-label="Custom color">
                    <span>Pick a custom color</span>
                </div>
            </section>

            <div class="eyebrow">EDIT</div>
            <section class="editor-actions">
                <button type="button" id="undo">Undo</button>
                <button type="button" id="redo">Redo</button>
                <button type="button" id="clear">Clear</button>
            </section>
        </aside>
        <div class="workspace">
            <div id="plot" tabindex="0" role="img"
                aria-label="Pixel editor canvas. Paint with the pencil, line, or fill tool; pan with the pan tool, middle mouse button, or right mouse button.">

                <canvas id="canvas"></canvas>

                <div class="plot-note">
                    P pencil · L line · F fill · H pan · Ctrl+Z undo
                </div>
            </div>
        </div>
    </main>
</body>

</html>
