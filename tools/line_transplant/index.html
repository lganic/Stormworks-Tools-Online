<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Stormworks Tool</title>
    <meta name="description" content="Description of this tool.">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/app.js"></script>
    <script defer src="/js/sw-ducky-js.js"></script>
</head>

<body>
    <header>
        <a href="/" style="margin:0; display: flex;">
            <img src="/favicon.svg" height="32px">
            <h1>Stormworks Tools</h1>
        </a>
        <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="lganic" data-description="Support me on Buy me a coffee!" data-message="" data-color="#BD5FFF" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
    </header>
    <main>
        <div class="converter-layout">
            <div class="converter-grid">
                <div class="converter-column">
                    <h3>Input Tile Source</h3>
                    <p style="min-height: 50px;">This source will be used as the base.</p>

                    <label class="upload-btn">
                        <input type="file" id="base-button" accept=".bin" name = "file">
                        <span>+ Upload Bin File</span>
                    </label>

                    <canvas id="base-canvas" width="512" height="512"></canvas>
                </div>

                <div class="converter-column">
                    <h3>Input Line Source</h3>
                    <p style="min-height: 50px;">The lines from this tile will be extracted, and pasted onto the base tile.</p>
                    <label class="upload-btn">
                        <input type="file" id="line-button" accept=".bin" name = "file">
                        <span>+ Upload Bin File</span>
                    </label>
                    <canvas id="line-canvas" width="512" height="512"></canvas>
                </div>
            </div>

            <div class="converter-output">
                <label><input id="erase-old-lines" type="checkbox" checked>Erase Lines From Base</label>
                <button id="convert-button">Convert</button>
                <div id="output-area" style="display:none; text-align: center;">
                    <h3>Output</h3>
                    <canvas id="export-canvas" width="512" height="512"></canvas>
                    <button id="download-button">Download</button>
                </div>
            </div>
            <h5>Thanks to kadebrown for generously allowing me to use their mod for the tool icon.</h5>
        </div>
    </main>
</body>

</html>
